<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xuất kho</title>
    <link rel="stylesheet" href="../css/export.css">
</head>
<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>Tổng Kho</h2>
        <ul>
            <li data-page="home.html" onclick="goTo('home.html')">🏠 Home</li>
            <li data-page="import.html" onclick="goTo('import.html')">📥 Nhập kho</li>
            <li data-page="export.html" onclick="goTo('export.html')">📤 Xuất kho</li>
            <li data-page="inventory.html" onclick="goTo('inventory.html')">📦 Tồn kho</li>
            <li data-page="history.html" onclick="goTo('history.html')">🕒 Lịch sử</li>
            <li data-page="support.html" onclick="goTo('support.html')">💬 Hỗ trợ</li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <input type="text" placeholder="Tìm kiếm sản phẩm...">
            <div class="avatar-box">
                <img src="../images/avatar.jpg">
            </div>
        </header>

        <section class="welcome">
            <h1>Xuất kho 📤</h1>
            <p>Xuất cuộn vải khỏi kho</p>
        </section>

        <section class="export-form-box">
            <form class="export-form">
                <input type="text" placeholder="Mã vải">
                <input type="text" placeholder="Tên vải">

                <select>
                    <option>Loại vải</option>
                    <option>Cotton</option>
                    <option>Linen</option>
                    <option>Denim</option>
                </select>

                <input type="number" placeholder="Số mét xuất">
                <input type="text" placeholder="Khách hàng">
                <input type="date">

                <button type="submit">Xuất kho</button>
            </form>
        </section>
    </main>
</div>

    <script>
        const form = document.querySelector(".export-form");

        form.addEventListener("submit", function(e){
            e.preventDefault();
            alert("Xuất kho thành công!");
            form.reset();
        });
    </script>
    
    <script src="../js/sidebar.js"></script>


</body>
</html>
